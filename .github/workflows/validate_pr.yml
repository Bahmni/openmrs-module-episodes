name: Validate PR
on:
  pull_request:
    branches:
      - master

jobs:
  build-test-package:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and Package with Maven
        run: ./mvnw --no-transfer-progress clean -U install
